<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Black Friday Grid 🖤</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --accent-pink: #ff00cc;
            --accent-purple: #3300ff;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #fff;
            --bg-dark: #050505;
            --bg-light: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            margin-bottom: 2rem;
            margin-top: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            animation: float 3s ease-in-out infinite;
            text-transform: uppercase;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
            50% { transform: translateY(-5px); text-shadow: 0 0 35px rgba(0, 242, 254, 0.8); }
        }

        .grid-container {
            display: grid;
            /* Forced 10 columns as requested */
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            width: 95%;
            max-width: 1200px;
            padding: 20px;
            perspective: 1000px;
            margin-bottom: 40px;
        }

        /* Responsive adjustments for smaller screens to keep 10 columns legible or allow scroll */
        @media (max-width: 800px) {
            .grid-container {
                gap: 6px;
                padding: 10px;
            }
        }

        .number-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        /* Glossy Shine Effect - Updated for dark mode */
        .number-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.1) 0%, transparent 40%, transparent 100%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .number-card:hover {
            transform: translateY(-5px) scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px var(--primary-glow), 0 0 10px rgba(255,255,255,0.5);
            border-color: var(--primary-glow);
            z-index: 100;
            color: #fff;
        }

        .number-card:active {
            transform: scale(0.95);
        }

        /* Selected State - High Contrast Neon */
        .number-card.selected {
            background: #000; /* Deep black center to make border pop */
            border: 2px solid var(--primary-glow);
            box-shadow: 0 0 30px var(--primary-glow), inset 0 0 15px var(--primary-glow);
            color: var(--primary-glow);
            text-shadow: 0 0 10px var(--primary-glow);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1.0); }
        }

        /* Floating Text Micro-interaction */
        .pop-text {
            position: fixed;
            pointer-events: none;
            color: var(--primary-glow);
            font-weight: 800;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 1000;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        /* Start Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s;
        }

        .start-btn {
            background: linear-gradient(90deg, #000 0%, #333 100%);
            border: 2px solid var(--primary-glow);
            padding: 1.5rem 3rem;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            color: var(--primary-glow);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            transition: all 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: var(--primary-glow);
            color: #000;
            box-shadow: 0 0 50px var(--primary-glow);
        }

    </style>
</head>
<body>

    <!-- Audio Consent Overlay -->
    <div id="overlay">
        <button class="start-btn" id="startBtn">🔥 Enter Black Friday 🔥</button>
    </div>

    <h1>✨ Black Friday Grid ✨</h1>
    
    <div class="grid-container" id="grid"></div>

    <script>
        // --- Setup ---
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        let audioCtx;
        
        const funnyPhrases = [
            "Sold!", "Steal!", "Luxe!", "Mine!", "Bag it!", 
            "Spicy!", "Rich!", "Divine!", "Iconic!", 
            "Serving!", "Black!", "Glow!", "Sheesh!", "Pop!"
        ];

        // --- Audio Context Setup (Web Audio API) ---
        // We use synth to avoid external files and keep it lightweight/reliable
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Sound Effects ---
        
        // Hover Sound: A tiny, high-pitched "tick" or sparkle
        function playHoverSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        // Click Sound: A lush, major chord "bling"
        function playClickSound() {
            if (!audioCtx) return;
            
            const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C Major chord
            const now = audioCtx.currentTime;

            frequencies.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle'; // Softer than square, richer than sine
                osc.frequency.setValueAtTime(freq, now);
                
                // Stagger starts slightly for arpeggio effect
                const startTime = now + (i * 0.03);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.05, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + 0.6);
            });
        }

        // --- Visual Effects ---

        function createPopText(x, y) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            
            // Random slight rotation for fun
            const rot = (Math.random() - 0.5) * 30;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.transform = `rotate(${rot}deg)`;
            
            document.body.appendChild(el);
            
            // Cleanup
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // --- Grid Generation ---
        
        function createGrid() {
            for (let i = 1; i <= 80; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.textContent = i;
                
                // Hover interaction
                card.addEventListener('mouseenter', () => {
                    playHoverSound();
                });

                // Click interaction
                card.addEventListener('click', (e) => {
                    // Toggle selection state
                    const isSelected = card.classList.toggle('selected');
                    
                    if (isSelected) {
                        playClickSound();
                        
                        // Get click position for the pop text
                        // Use clientX/Y from event or get bounding rect center if needed
                        // Using event coordinates is more playful
                        createPopText(e.clientX, e.clientY);
                    }
                });

                grid.appendChild(card);
            }
        }

        // --- Init ---

        startBtn.addEventListener('click', () => {
            initAudio();
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        });

        createGrid();

    </script>
</body>
</html>

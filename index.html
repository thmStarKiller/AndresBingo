<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEC BLACK FRIDAY BINGO 🖤✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #ffd700;
            --secondary-glow: #ff6b6b;
            --accent-pink: #ff00cc;
            --accent-purple: #8b00ff;
            --gold: #ffd700;
            --rose-gold: #b76e79;
            --diamond: #b9f2ff;
            --glass-bg: rgba(20, 20, 20, 0.7);
            --glass-border: rgba(255, 215, 0, 0.2);
            --text-color: #fff;
            --bg-dark: #000000;
            --bg-light: #0a0a0a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('img/kittyBF.jpg') center center / cover no-repeat fixed;
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Dark overlay to keep text readable */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(183, 110, 121, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 0, 255, 0.05) 0%, transparent 70%),
                rgba(0, 0, 0, 0.75);
            z-index: -2;
            animation: bgShift 15s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Floating sparkles */
        .sparkle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkleFloat 8s ease-in-out infinite;
            box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Luxe Header Section */
        .header-section {
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .crown-emoji {
            font-size: 3rem;
            display: block;
            animation: crownBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }

        @keyframes crownBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--rose-gold);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            animation: shimmerText 3s ease-in-out infinite;
        }

        @keyframes shimmerText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0.5rem 0;
            background: linear-gradient(135deg, #ffd700 0%, #fff 25%, #ffd700 50%, #fff 75%, #ffd700 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 3s ease-in-out infinite, float 4s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
            position: relative;
        }

        h1::before, h1::after {
            content: '✦';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            -webkit-text-fill-color: var(--gold);
            animation: starPulse 1.5s ease-in-out infinite;
        }

        h1::before { left: -2rem; animation-delay: 0s; }
        h1::after { right: -2rem; animation-delay: 0.75s; }

        @keyframes starPulse {
            0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(0.8); }
            50% { opacity: 1; transform: translateY(-50%) scale(1.2); }
        }

        @keyframes goldShimmer {
            0% { background-position: 200% 50%; }
            100% { background-position: -200% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--diamond);
            letter-spacing: 3px;
            margin-top: 0.5rem;
            animation: subtitleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes subtitleGlow {
            0% { text-shadow: 0 0 10px rgba(185, 242, 255, 0.5); }
            100% { text-shadow: 0 0 25px rgba(185, 242, 255, 0.9), 0 0 40px rgba(185, 242, 255, 0.5); }
        }

        .emoji-row {
            font-size: 1.5rem;
            margin-top: 1rem;
            animation: emojiWave 2s ease-in-out infinite;
        }

        @keyframes emojiWave {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.05) rotate(-2deg); }
            75% { transform: scale(1.05) rotate(2deg); }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            width: 95%;
            max-width: 1200px;
            padding: 20px;
            perspective: 1000px;
            margin-bottom: 40px;
        }

        @media (max-width: 800px) {
            .grid-container {
                gap: 6px;
                padding: 10px;
            }
            h1 { font-size: 2rem; letter-spacing: 2px; }
            h1::before, h1::after { display: none; }
            .crown-emoji { font-size: 2rem; }
        }

        .number-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 4px 20px rgba(0,0,0,0.6), 
                inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .number-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
            transition: left 0.5s;
        }

        .number-card:hover::before {
            left: 100%;
        }

        .number-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 100%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .number-card:hover {
            transform: translateY(-8px) scale(1.15) rotateX(5deg);
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 
                0 0 30px var(--gold), 
                0 0 60px rgba(255,215,0,0.3),
                0 20px 40px rgba(0,0,0,0.4);
            border-color: var(--gold);
            z-index: 100;
            color: var(--gold);
        }

        .number-card:active {
            transform: scale(0.95);
        }

        .number-card.selected {
            background: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.9) 100%);
            border: 2px solid var(--gold);
            box-shadow: 
                0 0 40px var(--gold), 
                0 0 80px rgba(255,215,0,0.4),
                inset 0 0 20px rgba(255,215,0,0.3);
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), selectedPulse 2s ease-in-out infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { box-shadow: 0 0 40px var(--gold), 0 0 80px rgba(255,215,0,0.4), inset 0 0 20px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 0 50px var(--gold), 0 0 100px rgba(255,215,0,0.6), inset 0 0 30px rgba(255,215,0,0.5); }
        }

        @keyframes popIn {
            0% { transform: scale(0.7) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(3deg); }
            100% { transform: scale(1.0) rotate(0deg); }
        }

        .pop-text {
            position: fixed;
            pointer-events: none;
            background: linear-gradient(135deg, var(--gold), var(--rose-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 1.8rem;
            z-index: 1000;
            animation: floatUp 1s ease-out forwards;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.8));
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(-10deg); }
            20% { opacity: 1; transform: translateY(-40px) scale(1.3) rotate(5deg); }
            100% { opacity: 0; transform: translateY(-100px) scale(1) rotate(0deg); }
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.6s ease-out;
        }

        .overlay-content {
            text-align: center;
            animation: overlayFadeIn 1s ease-out;
        }

        @keyframes overlayFadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .overlay-crown {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: crownBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.8));
        }

        .overlay-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffd700, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            letter-spacing: 3px;
        }

        .start-btn {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%);
            border: 2px solid var(--gold);
            padding: 1.5rem 4rem;
            border-radius: 60px;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--gold);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .start-btn:hover {
            transform: scale(1.1) translateY(-5px);
            background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
            color: #000;
            box-shadow: 
                0 0 60px var(--gold),
                0 0 100px rgba(255,215,0,0.5),
                0 20px 40px rgba(0,0,0,0.5);
        }

        /* Footer vibes */
        .footer-vibes {
            text-align: center;
            padding: 2rem;
            color: var(--rose-gold);
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .footer-vibes span {
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

    </style>
</head>
<body>

    <!-- Sparkle particles -->
    <div class="sparkle-container" id="sparkles"></div>

    <!-- Audio Consent Overlay -->
    <div id="overlay">
        <div class="overlay-content">
            <div class="overlay-crown">👑</div>
            <div class="overlay-title">Welcome to the Slay Zone</div>
            <button class="start-btn" id="startBtn">💎 Enter The Bingo 💎</button>
        </div>
    </div>

    <div class="header-section">
        <span class="crown-emoji">👑</span>
        <div class="tagline">✧ Slay & Play ✧</div>
        <h1>DEC BLACK FRIDAY BINGO</h1>
        <div class="subtitle">💅 It's Giving Main Character Energy 💅</div>
        <div class="emoji-row">🖤 ✨ 💰 ✨ 🖤</div>
    </div>
    
    <div class="grid-container" id="grid"></div>

    <div class="footer-vibes">
        Made with <span>💖</span> for the Black Friday Queens
    </div>

    <script>
        // --- Setup ---
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        const sparkleContainer = document.getElementById('sparkles');
        let audioCtx;
        
        // Custom sound for number clicks
        const clickSound = new Audio('sound/googAndres.mp3');
        
        // Yassified funny phrases 💅
        const funnyPhrases = [
            "SLAY!", "Iconic!", "Period!", "Ate that!", "Mother!", 
            "Serving!", "No cap!", "Luxe!", "It's giving!", "Yasss!", 
            "Rich!", "Divine!", "Sheesh!", "Main character!", "Purr!",
            "Obsessed!", "Sliving!", "Gorge!", "Bingo!", "Queen!",
            "Crown it!", "Stunning!", "Extra!", "Glow up!", "Fierce!",
            "Chef's kiss!", "Vibes!", "Legend!", "Secure!", "Bag it!"
        ];

        // --- Create floating sparkles ---
        function createSparkles() {
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 8 + 's';
                sparkle.style.animationDuration = (6 + Math.random() * 4) + 's';
                
                // Random sparkle colors
                const colors = ['#ffd700', '#b76e79', '#b9f2ff', '#ff6b6b', '#fff'];
                sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.boxShadow = `0 0 10px ${sparkle.style.background}, 0 0 20px ${sparkle.style.background}`;
                
                sparkleContainer.appendChild(sparkle);
            }
        }

        // --- Audio Context Setup (Web Audio API) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Sound Effects ---
        
        // Hover Sound: A luxurious sparkle
        function playHoverSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.04);
        }

        // Click Sound: A gorgeous, rich "bling" chord
        function playClickSound() {
            if (!audioCtx) return;
            
            const frequencies = [659.25, 830.61, 987.77, 1318.51]; // E Major chord - brighter, more luxe
            const now = audioCtx.currentTime;

            frequencies.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                
                const startTime = now + (i * 0.025);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.04, startTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.7);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + 0.7);
            });
        }

        // --- Visual Effects ---

        function createPopText(x, y) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            
            const rot = (Math.random() - 0.5) * 40;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.transform = `rotate(${rot}deg)`;
            
            document.body.appendChild(el);
            
            // Create mini sparkle burst
            createMiniSparkles(x, y);
            
            setTimeout(() => {
                el.remove();
            }, 1000);
        }

        // Mini sparkle burst on click
        function createMiniSparkles(x, y) {
            for (let i = 0; i < 8; i++) {
                const spark = document.createElement('div');
                spark.style.position = 'fixed';
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                spark.style.width = '6px';
                spark.style.height = '6px';
                spark.style.borderRadius = '50%';
                spark.style.background = '#ffd700';
                spark.style.boxShadow = '0 0 10px #ffd700';
                spark.style.pointerEvents = 'none';
                spark.style.zIndex = '999';
                
                const angle = (i / 8) * Math.PI * 2;
                const velocity = 50 + Math.random() * 50;
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;
                
                spark.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'cubic-bezier(0, 0, 0.2, 1)'
                });
                
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        // --- Grid Generation ---
        
        function createGrid() {
            for (let i = 1; i <= 80; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.textContent = i;
                
                // Staggered entrance animation
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px) scale(0.9)';
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0) scale(1)';
                }, i * 15);
                
                // Hover interaction
                card.addEventListener('mouseenter', () => {
                    playHoverSound();
                });

                // Click interaction
                card.addEventListener('click', (e) => {
                    const isSelected = card.classList.toggle('selected');
                    
                    if (isSelected) {
                        // Play the custom sound
                        clickSound.currentTime = 0;
                        clickSound.play();
                        
                        createPopText(e.clientX, e.clientY);
                    }
                });

                grid.appendChild(card);
            }
        }

        // --- Init ---

        startBtn.addEventListener('click', () => {
            initAudio();
            overlay.style.opacity = '0';
            overlay.style.transform = 'scale(1.1)';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);
        });

        createSparkles();
        createGrid();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEC BLACK FRIDAY BINGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #ffffff;
            --hover-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            /* Subtle texture overlay using the image but heavily processed */
            background-image: url('img/kittyBF.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Heavy matte overlay for the Rick Owens vibe */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: grayscale(100%) contrast(120%) blur(20px);
            z-index: -1;
        }

        /* Header Section - Minimalist */
        .header-section {
            text-align: center;
            padding: 4rem 1rem 2rem;
            position: relative;
            z-index: 1;
            max-width: 800px;
        }

        h1 {
            font-weight: 800;
            font-size: 3rem;
            margin: 0;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Grid System - Precision */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            width: 95%;
            max-width: 1000px;
            padding: 20px;
            margin-bottom: 60px;
            z-index: 1;
        }

        @media (max-width: 800px) {
            .grid-container {
                gap: 4px;
                padding: 10px;
            }
            h1 { font-size: 2rem; }
        }

        /* Card Design - Apple/Rick Owens Fusion */
        .number-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        /* Hover State - Subtle Glow */
        .number-card:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Selected State - High Contrast Brutalist */
        .number-card.selected {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* Pop Text - Minimalist */
        .pop-text {
            position: fixed;
            pointer-events: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            z-index: 1000;
            animation: floatUp 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            text-transform: uppercase;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.95); }
            20% { opacity: 1; transform: translateY(-20px) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }

        /* Overlay - Glassmorphism */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(30px) saturate(180%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.6s ease-out;
        }

        .overlay-content {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .start-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.2rem 3rem;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .start-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Footer - Minimal */
        .footer-vibes {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            opacity: 0.6;
            text-transform: uppercase;
            z-index: 1;
        }

    </style>
</head>
<body>

    <!-- Audio Consent Overlay -->
    <div id="overlay">
        <div class="overlay-content">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">DEC BLACK FRIDAY</h1>
            <button class="start-btn" id="startBtn">Enter Experience</button>
        </div>
    </div>

    <div class="header-section">
        <h1>Dec Black Friday Bingo</h1>
        <div class="subtitle">The Collection • 2025</div>
    </div>
    
    <div class="grid-container" id="grid"></div>

    <div class="footer-vibes">
        Designed in California • Assembled for Queens
    </div>

    <script>
        // --- Setup ---
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        let audioCtx;
        
        // Custom sound for number clicks
        const clickSound = new Audio('sound/googAndres.mp3');
        
        // Yassified funny phrases - kept but styled minimally
        const funnyPhrases = [
            "SLAY", "ICONIC", "PERIOD", "ATE", "MOTHER", 
            "SERVING", "NO CAP", "LUXE", "GIVING", "YASSS", 
            "RICH", "DIVINE", "SHEESH", "MAIN", "PURR",
            "OBSESSED", "SLIVING", "GORGE", "BINGO", "QUEEN",
            "CROWN", "STUNNING", "EXTRA", "GLOW", "FIERCE",
            "CHEF'S KISS", "VIBES", "LEGEND", "SECURE", "BAG IT"
        ];

        // --- Audio Context Setup (Web Audio API) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Sound Effects ---
        
        // Hover Sound: Subtle, high-end click
        function playHoverSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.005, audioCtx.currentTime); // Very quiet
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.03);
        }

        // --- Visual Effects ---

        function createPopText(x, y) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            
            // No rotation, just clean vertical movement
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // --- Grid Generation ---
        
        function createGrid() {
            for (let i = 1; i <= 80; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.textContent = i;
                
                // Subtle entrance
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, i * 10);
                
                // Hover interaction
                card.addEventListener('mouseenter', () => {
                    playHoverSound();
                });

                // Click interaction
                card.addEventListener('click', (e) => {
                    const isSelected = card.classList.toggle('selected');
                    
                    if (isSelected) {
                        // Play the custom sound
                        clickSound.currentTime = 0;
                        clickSound.play();
                        
                        createPopText(e.clientX, e.clientY);
                    }
                });

                grid.appendChild(card);
            }
        }

        // --- Init ---

        startBtn.addEventListener('click', () => {
            initAudio();
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);
        });

        createGrid();

    </script>
</body>
</html>
